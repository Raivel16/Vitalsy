server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # RNF-01: WebSocket de alertas (Reverb). En produccion termine TLS aqui o en el balanceador:
    # el navegador debe usar wss://<dominio>/app (RNF-05) y REVERB_ALLOWED_ORIGINS el dominio https.
    location /app/ {
        set $vitalsy_reverb reverb:8080;
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass http://$vitalsy_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
