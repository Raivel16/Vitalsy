# Cabeceras reenviadas a toda ubicacion proxificada (RNF-05). Se incluye en CADA location porque
# nginx no hereda proxy_set_header cuando la location define el suyo. $host ya esta validado
# contra server_name; X-Forwarded-Host/Port se sobrescriben para que el cliente no pueda inyectarlos.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
