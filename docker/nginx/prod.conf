# Proxy inverso de PRODUCCION (RNF-05, RNF-10): unico servicio que publica puertos.
# - 80: solo redirige a HTTPS (301); no sirve contenido ni API por HTTP.
# - 443: TLS 1.3 solamente; frontend, API (/api, /sanctum) y Reverb (/app, wss).
# Certificados: se montan en /etc/nginx/certs (fullchain.pem + privkey.pem); NO se versionan.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Reto ACME (http-01) opcional para Let's Encrypt/certbot en modo webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # RNF-05: solo TLS 1.3 (los cifrados de 1.3 son todos AEAD; no se configuran suites heredadas).
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:VitalsySSL:10m;
    ssl_session_tickets off;

    # HSTS un anio. 'preload' es una decision deliberada (irreversible a corto plazo): no se activa aqui.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Reverb (RNF-01): wss://<dominio>/app
    location /app/ {
        set $vitalsy_reverb reverb:8080;
        proxy_pass http://$vitalsy_reverb;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $vitalsy_backend backend:3000;
        proxy_pass http://$vitalsy_backend;
    }

    location /sanctum/ {
        set $vitalsy_backend backend:3000;
        proxy_pass http://$vitalsy_backend;
    }

    location = /up {
        set $vitalsy_backend backend:3000;
        proxy_pass http://$vitalsy_backend;
    }

    location / {
        set $vitalsy_frontend frontend:4200;
        proxy_pass http://$vitalsy_frontend;
    }
}
