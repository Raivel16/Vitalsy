upstream vitalsy_frontend {
    server frontend:5173;
}

# HTTP (PC / desarrollo habitual)
server {
    listen 80;
    server_name localhost _;

    client_max_body_size 8m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # RNF-01: WebSocket de alertas (Laravel Reverb, protocolo Pusher) en /app/{clave}.
    location /app/ {
        set $vitalsy_reverb reverb:8080;
        proxy_pass http://$vitalsy_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $vitalsy_backend backend:8000;
        proxy_pass http://$vitalsy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sanctum/ {
        set $vitalsy_backend backend:8000;
        proxy_pass http://$vitalsy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /up {
        set $vitalsy_backend backend:8000;
        proxy_pass http://$vitalsy_backend;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://vitalsy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS (teléfono / cámara del escáner de brazalete)
server {
    listen 443 ssl;
    server_name localhost _;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # RNF-01: WebSocket de alertas (Laravel Reverb, protocolo Pusher) en /app/{clave}.
    location /app/ {
        set $vitalsy_reverb reverb:8080;
        proxy_pass http://$vitalsy_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $vitalsy_backend backend:8000;
        proxy_pass http://$vitalsy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /sanctum/ {
        set $vitalsy_backend backend:8000;
        proxy_pass http://$vitalsy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /up {
        set $vitalsy_backend backend:8000;
        proxy_pass http://$vitalsy_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://vitalsy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
