# El arranque de desarrollo está en docker-compose.yml (Nginx en el puerto 8080).
# Este archivo usa las mismas rutas de módulo que el laboratorio.

services:
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    environment:
      PORT: "4200"
    ports:
      - "4200:4200"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      PORT: "3000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mi_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME:-mi_db}
      DB_USERNAME: ${DB_USER:-postgres}
      # RNF-01 / RNF-05: Reverb detras del proxy TLS (wss) en /app; el backend publica por red interna.
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - reverb

  reverb:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      # Origenes permitidos del navegador (dominio publico con HTTPS).
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS}
    # Sin puerto publicado: solo el proxy TLS (wss://<dominio>/app) llega a este servicio.

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mi_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
