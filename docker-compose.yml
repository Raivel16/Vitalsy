services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_HMR_CLIENT_PORT: "8080"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    command: ["sh", "/usr/local/bin/dev-entrypoint.sh"]
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend:/var/www/html
      - /var/www/html/vendor
      - ./docker/backend/dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:Dk5aG9UDHcSXVpV5u+m5OnNPqHywvv07vZKzXwJvqRY=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mi_db
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
