services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - reverb

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      PORT: "5173"
      VITE_PROXY_TARGET: http://backend:8000
      VITE_HMR_CLIENT_PORT: "8080"
      VITE_REVERB_APP_PUBLIC: ${REVERB_APP_KEY:-vitalsy-local-key}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    # Solo desarrollo: el entrypoint ejecuta `composer install` sobre el volumen anonimo de
    # vendor. Como root no depende del dueno que traiga ese volumen (imagen vieja o recreada).
    user: root
    command: ["sh", "/usr/local/bin/dev-entrypoint.sh"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/api:/var/www/html
      - /var/www/html/vendor
      - ./docker/backend/dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      APP_LOCALE: es
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Lima}
      PORT: "8000"
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:8080,localhost:8443,localhost:5173,localhost:4200,127.0.0.1:8080,127.0.0.1:8443,192.168.*.*:8080,192.168.*.*:8443,10.*.*.*:8080,10.*.*.*:8443,__SANCTUM_CURRENT_REQUEST_HOST__
      SESSION_DOMAIN: ""
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mi_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME:-mi_db}
      DB_USERNAME: ${DB_USER:-postgres}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      # RNF-01: el backend publica en Reverb por la red interna; los navegadores entran por Nginx (/app).
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-vitalsy}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-vitalsy-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-vitalsy-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    depends_on:
      - postgres
      - reverb

  reverb:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    user: root
    # Comparte el codigo del backend; espera a que el servicio backend instale vendor.
    command: ["sh", "-c", "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan reverb:start --host=0.0.0.0 --port=8080"]
    volumes:
      - ./backend/api:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-vitalsy}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-vitalsy-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-vitalsy-local-secret}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"

  # HP-01: sin esto `alerts:process-slas` (escalamiento SLA, recordatorios) nunca corre solo.
  scheduler:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    user: root
    command: ["sh", "-c", "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan schedule:work"]
    volumes:
      - ./backend/api:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Lima}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-mi_db}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: file
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-vitalsy}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-vitalsy-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-vitalsy-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    depends_on:
      - postgres
      - backend

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mi_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
