name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial: Desactiva el clonado superficial para que Sonar asocie autores y ramas

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            movil/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.2.35"
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, pcov
          coverage: pcov
          tools: composer

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        working-directory: frontend/web
        run: npm test

      - name: Build frontend
        working-directory: frontend/web
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare backend test environment
        working-directory: backend/api
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/testing.sqlite

      # Genera backend/api/coverage.xml (Clover) con PCOV para SonarQube.
      - name: Run backend tests with coverage
        working-directory: backend/api
        run: php artisan test --coverage-clover coverage.xml

      - name: Run backend lint or static checks
        working-directory: backend/api
        run: ./vendor/bin/pint --test

      - name: Install mobile dependencies
        working-directory: movil
        run: npm ci --ignore-scripts

      # Genera movil/coverage/lcov.info para SonarQube.
      - name: Run mobile tests with coverage
        working-directory: movil
        run: ./node_modules/.bin/jest --ci --coverage

      # Análisis de SonarQube Cloud. Acción fijada al commit del tag v8.3.0.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          # Solo en el CI (no en sonar-project.properties, que es el archivo de la entrega): los *.test.ts(x) y el e2e
          # cuentan como tests y el resto como codigo, que es lo que mide la evaluacion oficial (ver docs/agent-context.md).
          args: >
            -Dsonar.tests=frontend/web/src,movil/src,frontend/web/e2e
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,frontend/web/e2e/**
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,frontend/web/e2e/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
