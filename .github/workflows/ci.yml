name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial: Desactiva el clonado superficial para que Sonar asocie autores y ramas

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            movil/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.2.35"
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, pcov
          coverage: pcov
          tools: composer

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        working-directory: frontend/web
        run: npm test

      - name: Build frontend
        working-directory: frontend/web
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare backend test environment
        working-directory: backend/api
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/testing.sqlite

      # Genera backend/api/coverage.xml (Clover) con PCOV para SonarQube.
      - name: Run backend tests with coverage
        working-directory: backend/api
        run: php artisan test --coverage-clover coverage.xml

      - name: Run backend lint or static checks
        working-directory: backend/api
        run: ./vendor/bin/pint --test

      - name: Install mobile dependencies
        working-directory: movil
        run: npm ci --ignore-scripts

      # Genera movil/coverage/lcov.info para SonarQube.
      - name: Run mobile tests with coverage
        working-directory: movil
        run: ./node_modules/.bin/jest --ci --coverage

      # Análisis de SonarQube Cloud. Acción fijada al commit del tag v8.3.0.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          # La evaluacion oficial analiza el repositorio completo sin exclusiones; aqui se replica (ver docs/agent-context.md).
          args: >
            -Dsonar.sources=.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Proceso de pruebas E2E con Cypress sobre el stack real (Nginx + frontend + API + PostgreSQL).
  # Corre después de `validate`: si una prueba falla, el workflow falla y los videos y capturas quedan en artefactos.
  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Se instala antes de levantar el stack: si no, el volumen de compose crea node_modules como root.
      - name: Install frontend dependencies
        working-directory: frontend/web
        run: |
          npm ci --ignore-scripts
          npx cypress install

      # Credenciales efímeras del runner: no hay secretos del repositorio en el stack de pruebas.
      - name: Prepare environment and certificates
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          bash docker/nginx/generate-dev-certs.sh

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "API lista tras $attempt intentos"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=80 backend
          exit 1

      - name: Run Cypress
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          working-directory: frontend/web
          install: false
          browser: electron
          command: npm run cy:run
        env:
          CYPRESS_BASE_URL: http://localhost:8080
          CYPRESS_DEMO_PASSWORD: password_ejemplo

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-resultados
          path: |
            frontend/web/cypress/results
            frontend/web/cypress/screenshots
            frontend/web/cypress/videos
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=120

      - name: Stop the stack
        if: always()
        run: docker compose down -v
