name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial: Desactiva el clonado superficial para que Sonar asocie autores y ramas

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            movil/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2.35"
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, pcov
          coverage: pcov
          tools: composer

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend/web
        run: npm test

      - name: Build frontend
        working-directory: frontend/web
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare backend test environment
        working-directory: backend/api
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/testing.sqlite

      # Genera backend/api/coverage.xml (Clover) con PCOV para SonarQube.
      - name: Run backend tests with coverage
        working-directory: backend/api
        run: php artisan test --coverage-clover coverage.xml

      - name: Run backend lint or static checks
        working-directory: backend/api
        run: ./vendor/bin/pint --test

      - name: Install mobile dependencies
        working-directory: movil
        run: npm ci

      # Genera movil/coverage/lcov.info para SonarQube.
      - name: Run mobile tests with coverage
        working-directory: movil
        run: npx jest --ci --coverage

      # Deja la cobertura fresca en coverage-reports/ con rutas relativas a la raiz,
      # el mismo layout que lee la evaluacion oficial. Solo vive en el workspace del CI.
      - name: Prepare coverage reports for SonarQube
        run: |
          mkdir -p coverage-reports
          sed -e '/^SF:/ s#[\]#/#g' -e 's#^SF:src/#SF:frontend/web/src/#' frontend/web/coverage/lcov.info > coverage-reports/lcov-frontend.info
          sed -e '/^SF:/ s#[\]#/#g' -e 's#^SF:src/#SF:movil/src/#' movil/coverage/lcov.info > coverage-reports/lcov-movil.info
          sed "s#${GITHUB_WORKSPACE}/##g" backend/api/coverage.xml > coverage-reports/php-coverage.xml

      # Análisis de SonarQube Cloud. Acción fijada al commit del tag v8.3.0.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          # Solo en el CI (no en sonar-project.properties, que es el archivo de la entrega):
          # los tests cuentan como tests, no como codigo sin cobertura, y los reportes de cobertura no se analizan.
          args: >
            -Dsonar.tests=backend/api/tests,frontend/web/e2e,frontend/web/src,movil/src
            -Dsonar.test.inclusions=backend/api/tests/**,frontend/web/e2e/**,**/*.test.ts,**/*.test.tsx
            -Dsonar.exclusions=coverage-reports/**,backend/api/tests/**,frontend/web/e2e/**,**/*.test.ts,**/*.test.tsx
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
