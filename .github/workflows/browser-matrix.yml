name: Browser matrix

# RNF-18: Chromium, Firefox y WebKit contra los recorridos criticos.
# Requiere la variable de repositorio E2E_BASE_URL con un entorno de pruebas desplegado.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/web/**"
      - ".github/workflows/browser-matrix.yml"

jobs:
  e2e:
    if: ${{ vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci
      - name: Install Playwright test runner (sin tocar package.json)
        working-directory: frontend/web
        run: npm install --no-save @playwright/test@1.49.1
      - name: Install Playwright browser
        working-directory: frontend/web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run critical paths
        working-directory: frontend/web
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: npx playwright test --project=${{ matrix.browser }}
