<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a99a6"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a99a6"/></marker></defs><rect width="1400" height="300" fill="#fff"/><text x="24" y="34" font-size="19" font-weight="700" fill="#1d2b36">Flujo del proceso de monitoreo y respuesta a alertas</text><rect x="30" y="80" width="172" height="120" rx="10" fill="#e3f1f4" stroke="#1e6b7b" stroke-width="1.6" /><text x="116" y="102" text-anchor="middle" font-weight="700" font-size="13" fill="#1e6b7b">1. Constantes</text><text x="116" y="122" text-anchor="middle" font-size="12" fill="#1d2b36">Enfermera/auxiliar registra</text><text x="116" y="139" text-anchor="middle" font-size="12" fill="#1d2b36">o llega telemetría</text><line x1="202" y1="140" x2="224" y2="140" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><rect x="226" y="80" width="172" height="120" rx="10" fill="#e3f1f4" stroke="#1e6b7b" stroke-width="1.6" /><text x="312" y="102" text-anchor="middle" font-weight="700" font-size="13" fill="#1e6b7b">2. NEWS2</text><text x="312" y="122" text-anchor="middle" font-size="12" fill="#1d2b36">VitalSignsMonitoring calcula</text><text x="312" y="139" text-anchor="middle" font-size="12" fill="#1d2b36">el puntaje (RF-41)</text><line x1="398" y1="140" x2="420" y2="140" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><rect x="422" y="80" width="172" height="120" rx="10" fill="#e3f1f4" stroke="#1e6b7b" stroke-width="1.6" /><text x="508" y="102" text-anchor="middle" font-weight="700" font-size="13" fill="#1e6b7b">3. Alerta</text><text x="508" y="122" text-anchor="middle" font-size="12" fill="#1d2b36">NEWS2 ≥ 1 o deterioro</text><text x="508" y="139" text-anchor="middle" font-size="12" fill="#1d2b36">→ clinical_alerts (RF-39/40)</text><line x1="594" y1="140" x2="616" y2="140" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><rect x="618" y="80" width="172" height="120" rx="10" fill="#e3f1f4" stroke="#1e6b7b" stroke-width="1.6" /><text x="704" y="102" text-anchor="middle" font-weight="700" font-size="13" fill="#1e6b7b">4. Difusión</text><text x="704" y="122" text-anchor="middle" font-size="12" fill="#1d2b36">Observer → Reverb</text><text x="704" y="139" text-anchor="middle" font-size="12" fill="#1d2b36">campana + sirena (RF-53)</text><line x1="790" y1="140" x2="812" y2="140" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><rect x="814" y="80" width="172" height="120" rx="10" fill="#e3f1f4" stroke="#1e6b7b" stroke-width="1.6" /><text x="900" y="102" text-anchor="middle" font-weight="700" font-size="13" fill="#1e6b7b">5. Acuse</text><text x="900" y="122" text-anchor="middle" font-size="12" fill="#1d2b36">enfermera confirma</text><text x="900" y="139" text-anchor="middle" font-size="12" fill="#1d2b36">≤ 5 min (RF-44)</text><line x1="986" y1="140" x2="1008" y2="140" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><rect x="1010" y="80" width="172" height="120" rx="10" fill="#e3f1f4" stroke="#1e6b7b" stroke-width="1.6" /><text x="1096" y="102" text-anchor="middle" font-weight="700" font-size="13" fill="#1e6b7b">6. Escalamiento</text><text x="1096" y="122" text-anchor="middle" font-size="12" fill="#1d2b36">SLA vencido → supervisora,</text><text x="1096" y="139" text-anchor="middle" font-size="12" fill="#1d2b36">médico ≤ 15 min, ERR, UCI</text><line x1="1182" y1="140" x2="1204" y2="140" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><rect x="1206" y="80" width="172" height="120" rx="10" fill="#eef0fb" stroke="#4a55a2" stroke-width="1.6" /><text x="1292" y="102" text-anchor="middle" font-weight="700" font-size="13" fill="#4a55a2">7. Cierre y reporte</text><text x="1292" y="122" text-anchor="middle" font-size="12" fill="#1d2b36">timeline inmutable (RF-52)</text><text x="1292" y="139" text-anchor="middle" font-size="12" fill="#1d2b36">indicadores RF-114</text><text x="30" y="240" font-size="12" fill="#5b6b78">Cada paso persiste un evento en alert_events; los acuses y escalamientos quedan en alert_acknowledgements y alert_escalations, que son la fuente de los indicadores del módulo de reportes.</text></svg>