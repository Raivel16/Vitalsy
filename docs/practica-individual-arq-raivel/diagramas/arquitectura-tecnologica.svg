<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a99a6"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a99a6"/></marker></defs><rect width="1400" height="790" fill="#fff"/><text x="24" y="34" font-size="19" font-weight="700" fill="#1d2b36">Arquitectura tecnológica — Vitalsy (entorno de desarrollo, CI y despliegue)</text><rect x="30" y="60" width="320" height="330" rx="10" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6" /><text x="190" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#6b6b6b">Desarrollo (Windows 11)</text><text x="42" y="102" text-anchor="start" font-size="12" fill="#1d2b36">VS Code + Claude Code</text><text x="42" y="119" text-anchor="start" font-size="12" fill="#1d2b36">Git + GitHub (ramas feature/RF-XX)</text><text x="42" y="136" text-anchor="start" font-size="12" fill="#1d2b36">Node 22/24 (fnm) · npm</text><text x="42" y="153" text-anchor="start" font-size="12" fill="#1d2b36">PHP 8.2 + Composer · Xdebug</text><text x="42" y="170" text-anchor="start" font-size="12" fill="#1d2b36">Docker Desktop</text><text x="42" y="187" text-anchor="start" font-size="12" fill="#1d2b36">Vitest + Testing Library</text><text x="42" y="204" text-anchor="start" font-size="12" fill="#1d2b36">PHPUnit · Laravel Pint</text><text x="42" y="221" text-anchor="start" font-size="12" fill="#1d2b36">Cypress 16.2 (E2E)</text><rect x="380" y="60" width="640" height="330" rx="10" fill="#f7fbfc" stroke="#1e6b7b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="700" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#1e6b7b">Docker Compose (desarrollo · http://localhost:8080)</text><rect x="400" y="100" width="180" height="8