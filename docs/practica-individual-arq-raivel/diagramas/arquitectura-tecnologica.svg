-scanner-cli · Cypress contra :8080 con datos reales</text><rect x="1050" y="60" width="320" height="330" rx="10" fill="#eef0fb" stroke="#4a55a2" stroke-width="1.6" /><text x="1210" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#4a55a2">GitHub Actions (CI)</text><text x="1062" y="102" text-anchor="start" font-size="12" fill="#1d2b36">push / PR a dev y main</text><text x="1062" y="119" text-anchor="start" font-size="12" fill="#1d2b36">npm ci + Vitest con cobertura</text><text x="1062" y="136" text-anchor="start" font-size="12" fill="#1d2b36">build (tsc -b + vite build)</text><text x="1062" y="153" text-anchor="start" font-size="12" fill="#1d2b36">PHPUnit con cobertura + Pint</text><text x="1062" y="170" text-anchor="start" font-size="12" fill="#1d2b36">Jest (móvil)</text><text x="1062" y="187" text-anchor="start" font-size="12" fill="#1d2b36">SonarQube Cloud</text><text x="1062" y="204" text-anchor="start" font-size="12" fill="#1d2b36">(Raivel16_Vitalsy, sources=.)</text><rect x="30" y="440" width="990" height="200" rx="10" fill="#fffaf1" stroke="#a06a10" stroke-width="1.6" stroke-dasharray="6 4"/><text x="525" y="462" text-anchor="middle" font-weight="700" font-size="14" fill="#a06a10">Producción (docker-compose.prod.yml)</text><rect x="50" y="480" width="170" height="80" rx="10" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6" /><text x="135" y="502" text-anchor="middle" font-weight="700" font-size="14" fill="#6b6b6b">proxy</text><text x="135" y="522" text-anchor="middle" font-size="12" fill="#1d2b36">Nginx · TLS 1.3</text><rect x="240" y="480" width="160" height="80" rx="10" fill="#e3f1f4" stroke="#1e6b7b" stroke-width="1.6" /><text x="320" y="502" text-anchor="middle" font-weight="700" font-size="14" fill="#1e6b7b">frontend</text><text x="320" y="522" text-anchor="middle" font-size="12" fill="#1d2b36">build estático</text><rect x="420" y="480" width="160" height="80" rx="10" fill="#fdf3e1" stroke="#a06a10" stroke-width="1.6" /><text x="500" y="502" text-anchor="middle" font-weight="700" font-size="14" fill="#a06a10">backend</text><text x="500" y="522" text-anchor="middle" font-size="12" fill="#1d2b36">Laravel</text><rect x="600" y="480" width="120" height="80" rx="10" fill="#fbe9ec" stroke="#a3364b" stroke-width="1.6" /><text x="660" y="502" text-anchor="middle" font-weight="700" font-size="14" fill="#a3364b">reverb</text><text x="660" y="522" text-anchor="middle" font-size="12" fill="#1d2b36">wss://</text><rect x="740" y="480" width="120" height="80" rx="10" fill="#eef0fb" stroke="#4a55a2" stroke-width="1.6" /><text x="800" y="502" text-anchor="middle" font-weight="700" font-size="14" fill="#4a55a2">scheduler</text><text x="800" y="522" text-anchor="middle" font-size="12" fill="#1d2b36"></text><rect x="880" y="480" width="120" height="80" rx="10" fill="#e9f5ea" stroke="#2f7a3b" stroke-width="1.6" /><text x="940" y="502" text-anchor="middle" font-weight="700" font-size="14" fill="#2f7a3b">postgres</text><text x="940" y="522" text-anchor="middle" font-size="12" fill="#1d2b36">+ backup</text><text x="50" y="600" font-size="12" fill="#1d2b36">Cookies secure, SANCTUM_STATEFUL_DOMAINS con el dominio público, Reverb sin puertos publicados (RNF-05).</text><rect x="1050" y="440" width="320" height="200" rx="10" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6" /><text x="1210" y="462" text-anchor="middle" font-weight="700" font-size="14" fill="#6b6b6b">Laboratorio PaaS (GitLab)</text><text x="1062" y="482" text-anchor="start" font-size="12" fill="#1d2b36">gitlabcontinental.com</text><text x="1062" y="499" text-anchor="start" font-size="12" fill="#1d2b36">.gitlab-ci.yml → laboratorio-devops</text><text x="1062" y="516" text-anchor="start" font-size="12" fill="#1d2b36">project.yml: vitalsy</text><text x="1062" y="533" text-anchor="start" font-size="12" fill="#1d2b36">http://vitalsy.devops.local</text><text x="1062" y="550" text-anchor="start" font-size="12" fill="#1d2b36">SonarQube del laboratorio</text><rect x="30" y="690" width="1340" height="70" rx="10" fill="#e9f5ea" stroke="#2f7a3b" stroke-width="1.6" /><text x="700" y="712" text-anchor="middle" font-weight="700" font-size="14" fill="#2f7a3b">Usuarios</text><text x="700" y="732" text-anchor="middle" font-size="12" fill="#1d2b36">Navegador del personal clínico (enfermería, auxiliar, supervisora, jefatura, médicos, ERR) → https://&lt;dominio&gt; · avisos en tiempo real por WebSocket</text><line x1="350" y1="225" x2="378" y2="225" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><line x1="1020" y1="225" x2="1048" y2="225" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><text x="1034" y="215" font-size="11" fill="#5b6b78" text-anchor="middle">push</text><line x1="1210" y1="390" x2="1210" y2="438" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><text x="1216" y="408" font-size="11" fill="#5b6b78" text-anchor="start">despliegue</text><line x1="700" y1="690" x2="700" y2="642" stroke="#8a99a6" stroke-width="1.8" marker-end="url(#a)"  /><text x="706" y="660" font-size="11" fill="#5b6b78" text-anchor="start">HTTPS / WSS</text></svg>